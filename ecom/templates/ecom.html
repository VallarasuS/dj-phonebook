<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background-color: black;
            color: white;
        }
    </style>

</head>
<body>
    
    {% load static %}

    <div style="display: flex; flex-direction: row; justify-content: space-around;">

        <div style="
            display: flex;
            flex-direction: column; 
            background-color: rgb(47, 47, 47);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            gap: 5px;">
            <img style="width: 200px; height: auto;" src="{% static 'ecom/camera.png' %}">
            <label style="font-size: large;">Sony</label>
            <label style="font-size: small;">DSLR Camera </label>
            <label style="font-size: large; font-weight: lighter;">$63000</label>
            <input style="
            max-width: 250px; 
            background-color: yellow;
            color: black;
            border: 1px solid transparent;
            border-radius: 5px;
            padding: 10px;" type="button" value="Add to cart">
        </div>

         <div style="
            display: flex;
            flex-direction: column; 
            background-color: rgb(47, 47, 47);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            gap: 5px;">
            <img style="width: 200px; height: auto;" src="{% static 'ecom/camera.png' %}">
            <label style="font-size: large;">Sony</label>
            <label style="font-size: small;">DSLR Camera </label>
            <label style="font-size: large; font-weight: lighter;">$63000</label>

            max-width: 250px; 
            background-color: yellow;
            color: black;
            border: 1px solid transparent;
            border-radius: 3px;
            padding: 10px;" type="button" value="Add to cart">
        </div>
    </div>

</body>
</html>
